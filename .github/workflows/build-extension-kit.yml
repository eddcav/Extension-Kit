name: Build Extension-Kit

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            build-essential \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix \
            mingw-w64-tools \
            python3

      - name: Build all BOF modules
        run: |
          make clean || true
          make -j$(nproc)
          echo "[+] Build finished"

      - name: Show build results
        run: |
          echo "==================== All _bin directories ===================="
          find . -type d -name "_bin" | sort
          echo ""
          echo "==================== Critical sub-scripts check ===================="
          for f in \
            "Creds-BOF/nanodump/nanodump.axs" \
            "Creds-BOF/cookie-monster/cookie-monster.axs" \
            "Execution-BOF/No-Consolation/no_consolation.axs"; do
            if [ -f "$f" ]; then
              echo "[OK] $f"
            else
              echo "[MISSING] $f"
            fi
          done

      - name: Package artifacts (complete structure)
        run: |
          mkdir -p artifacts

          # 直接复制整个需要的模块目录（最稳妥的方式）
          for dir in AD-BOF Creds-BOF Elevation-BOF Execution-BOF Injection-BOF \
                     LateralMovement-BOF Postex-BOF Process-BOF SAL-BOF SAR-BOF; do
            if [ -d "$dir" ]; then
              # 复制整个目录，但排除一些不需要的大文件/缓存
              rsync -a --exclude='.git' --exclude='*.obj' --exclude='*.exe' \
                    --exclude='*.dll' --exclude='.vscode' \
                    "$dir" artifacts/
            fi
          done

          # 总入口
          cp extension-kit.axs artifacts/ 2>/dev/null || true
          cp README.md artifacts/ 2>/dev/null || true

          echo "==================== Final structure check ===================="
          echo "--- Creds-BOF sub scripts ---"
          ls -la artifacts/Creds-BOF/nanodump/*.axs 2>/dev/null || echo "nanodump.axs missing"
          ls -la artifacts/Creds-BOF/cookie-monster/*.axs 2>/dev/null || echo "cookie-monster.axs missing"
          echo ""
          echo "--- Execution-BOF sub scripts ---"
          ls -la artifacts/Execution-BOF/No-Consolation/*.axs 2>/dev/null || echo "no_consolation.axs missing"
          echo ""
          echo "--- _bin presence ---"
          for path in \
            "artifacts/Creds-BOF/_bin" \
            "artifacts/Execution-BOF/_bin" \
            "artifacts/AD-BOF/_bin" \
            "artifacts/AD-BOF/ADCS-BOF/_bin" \
            "artifacts/AD-BOF/Kerbeus-BOF/_bin" \
            "artifacts/AD-BOF/LDAP-BOF/_bin" \
            "artifacts/AD-BOF/RelayInformer/_bin" \
            "artifacts/AD-BOF/SQL-BOF/_bin"; do
            if [ -d "$path" ] && [ "$(ls -A $path 2>/dev/null)" ]; then
              echo "[OK] $path"
            else
              echo "[MISSING] $path"
            fi
          done

          echo ""
          echo "Package size:"
          du -sh artifacts

      - name: Upload Extension-Kit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Extension-Kit-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
